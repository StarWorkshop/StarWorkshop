<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 120" width="760" height="120" role="img" aria-label="Zheng Han — speech recognition and end-to-end spoken language models">
  <style>
    :root { color-scheme: light dark; }
    .ttl  { font: 600 26px ui-sans-serif, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1c2b4a; }
    .sub  { font: 400 14px ui-sans-serif, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #5c6b85; }
    .acc  { fill: #2563eb; }
    .bar  { fill: #2563eb; transform-origin: bottom; transform-box: fill-box;
            animation: bounce 1.5s ease-in-out infinite both; }
    .b2 { animation-delay: .3s } .b3 { animation-delay: .15s; fill: #d97706 }
    .b4 { animation-delay: .45s; fill: #d97706 } .b5 { animation-delay: .6s }
    @keyframes bounce { 0%,100% { transform: scaleY(.3) } 50% { transform: scaleY(1) } }
    .wipe { animation: reveal 3.2s steps(26, end) both; }
    @keyframes reveal { from { width: 0 } to { width: 540px } }
    .caretmove { animation: caret 3.2s steps(26, end) both; }
    @keyframes caret { from { transform: translateX(0) } to { transform: translateX(540px) } }
    .blink { animation: blink 1.1s step-end infinite both; }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-color-scheme: dark) {
      .ttl { fill: #e8eefc } .sub { fill: #a3b1c9 }
    }
  </style>

  <g transform="translate(24,34)">
    <rect class="bar"    x="0"  y="0" width="7" height="42" rx="3"/>
    <rect class="bar b2" x="12" y="0" width="7" height="42" rx="3"/>
    <rect class="bar b3" x="24" y="0" width="7" height="42" rx="3"/>
    <rect class="bar b4" x="36" y="0" width="7" height="42" rx="3"/>
    <rect class="bar b5" x="48" y="0" width="7" height="42" rx="3"/>
  </g>

  <clipPath id="tw"><rect class="wipe" x="90" y="18" width="540" height="40"/></clipPath>
  <text class="ttl" x="92" y="46" clip-path="url(#tw)">Zheng Han · 语音识别 × 端到端语音大模型</text>
  <g class="caretmove"><rect class="blink acc" x="92" y="24" width="3" height="28" rx="1"/></g>

  <text class="sub" x="92" y="78">Jinan University · offline-first · reproducible · streaming-native</text>
  <g transform="translate(92,92)">
    <rect width="86" height="4" rx="2" fill="#2563eb" opacity=".85"/>
    <rect x="92" width="52" height="4" rx="2" fill="#d97706" opacity=".85"/>
  </g>
</svg>
